# =============================================================================
# CI Pipeline — Minecraft NeoForge mod (Gradle)
# =============================================================================
# What this covers:
#   • Gradle wrapper integrity (validated automatically by setup-gradle)
#   • Build (compile + Gradle `check`, which runs any unit tests)
#   • Build output verification (jar name, expanded mod metadata, KubeJS plugin)
#   • Jar size report (job summary)
#   • Release readiness (advisory — CHANGELOG entry for mod_version)
#   • Semgrep SAST (community + Trail of Bits rules)
#   • Secret scanning (TruffleHog)
#   • Concurrency control (auto-cancel stale PR runs)
#   • Final gate job (single required status check for branch protection)
#
# When this runs:
#   • Pushes to main and pull requests targeting main (main is the newest
#     Minecraft version), plus the same for per-Minecraft-version release
#     branches named after the version (e.g. 1.20.1)
#   • Weekly (default branch only), to catch upstream breakage (Maven repos, dependency changes)
#   • Manually via workflow_dispatch
#   Tag pushes do not run CI; they are handled by publish-curseforge.yml.
#   Don't use [skip ci] on PR commits: it skips this workflow entirely, so the
#   required "CI ✅" check never reports and the PR cannot be merged.
#
# Note: third-party actions are pinned to full commit SHAs (with a version
# comment) to satisfy Semgrep's supply-chain rules and prevent mutable-tag
# hijacking.
# =============================================================================

name: CI

on:
  push:
    branches: [main, "[0-9]*.[0-9]*"]
  pull_request:
    branches: [main, "[0-9]*.[0-9]*"]
  schedule:
    # Weekly full run (Sundays at 03:00 UTC)
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every branch build finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  # ===========================================================================
  # 1. Build + Verification
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      # The Gradle cache is only written from the default branch.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read gradle.properties
        id: props
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d'=' -f2- | tr -d '[:space:]'; }
          {
            echo "mod_id=$(prop mod_id)"
            echo "mod_version=$(prop mod_version)"
            echo "minecraft_version=$(prop minecraft_version)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify build output
        env:
          MOD_ID: ${{ steps.props.outputs.mod_id }}
          MOD_VERSION: ${{ steps.props.outputs.mod_version }}
          MINECRAFT_VERSION: ${{ steps.props.outputs.minecraft_version }}
        run: |
          JAR="build/libs/${MOD_ID}-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected jar not found: $JAR"
            ls -la build/libs/
            exit 1
          fi
          echo "✅ Found $JAR"

          TOML=$(unzip -p "$JAR" META-INF/neoforge.mods.toml)
          if grep -q '\${' <<< "$TOML"; then
            echo "::error::neoforge.mods.toml contains unexpanded properties"
            grep -n '\${' <<< "$TOML"
            exit 1
          fi
          if ! grep -q "^version *= *\"${MOD_VERSION}\"" <<< "$TOML"; then
            echo "::error::neoforge.mods.toml version does not match mod_version (${MOD_VERSION})"
            exit 1
          fi
          echo "✅ neoforge.mods.toml expanded with version ${MOD_VERSION}"

          if ! unzip -l "$JAR" kubejs.plugins.txt > /dev/null; then
            echo "::error::kubejs.plugins.txt missing from jar; KubeJS will not load the plugin"
            exit 1
          fi
          echo "✅ kubejs.plugins.txt present"

          {
            echo "## 📦 Build Output"
            echo ""
            echo "| Jar | Size |"
            echo "| --- | --- |"
            for f in build/libs/*.jar; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.props.outputs.mod_id }}-jar
          path: build/libs/*.jar
          retention-days: 14

  # ===========================================================================
  # 2. Release Readiness (advisory — warns, never fails)
  # ===========================================================================
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CHANGELOG entry for mod_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          if grep -qF "## [${MOD_VERSION}]" CHANGELOG.md; then
            echo "✅ CHANGELOG.md has an entry for ${MOD_VERSION}"
          else
            echo "::warning file=CHANGELOG.md::No CHANGELOG.md entry for mod_version ${MOD_VERSION}. Add a '## [${MOD_VERSION}]' section before tagging v${MOD_VERSION}-mc${MINECRAFT_VERSION}, or the CurseForge release will use a fallback changelog."
          fi

  # ===========================================================================
  # 3. Semgrep SAST
  # ===========================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; bump the tag and digest together when updating.
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/trailofbits \
            --error \
            --exclude='build' \
            --exclude='.gradle' \
            --exclude='run' \
            --exclude='runs' \
            --json \
            --output=semgrep-results.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 30

  # ===========================================================================
  # 4. Secret Scanning (TruffleHog)
  # ===========================================================================
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified

  # ===========================================================================
  # 5. Final Gate — all required checks must pass
  # ===========================================================================
  ci-ok:
    name: CI ✅
    if: always()
    needs:
      - build
      - semgrep
      - secrets-scan
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          BUILD: ${{ needs.build.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SECRETS: ${{ needs.secrets-scan.result }}
        run: |
          echo "Build:    ${BUILD}"
          echo "Semgrep:  ${SEMGREP}"
          echo "Secrets:  ${SECRETS}"

          # Fail if any required job failed or was cancelled
          for result in "$BUILD" "$SEMGREP" "$SECRETS"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more required CI jobs failed"
              exit 1
            fi
          done

          echo "All required checks passed!"
